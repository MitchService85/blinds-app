<!-- Source of every icon in this folder. The PNGs and app/favicon.ico are rendered from this file (Chromium screenshot at 512/192/180/32); edit here, re-render, never hand-edit the PNGs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#137A72"/><stop offset="1" stop-color="#0A5652"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#light)"/>

  <!-- glass: light through the opening -->
  <rect x="129" y="105" width="254" height="234" rx="10" fill="url(#glass)"/>
  <!-- window frame -->
  <rect x="129" y="105" width="254" height="234" rx="10" fill="none" stroke="#F6F1E7" stroke-width="26" stroke-linejoin="round"/>
  <!-- mullions -->
  <rect x="248" y="118" width="16" height="208" fill="#F6F1E7"/>
  <rect x="142" y="214" width="228" height="16" fill="#F6F1E7"/>

  <!-- sill: what makes a grid read as a window, even at 32px -->
  <rect x="116" y="340" width="280" height="20" rx="6" fill="#F6F1E7"/>

  <!-- dimension line: exactly the sill's width -->
  <rect x="116" y="409" width="280" height="10" rx="5" fill="#F7B32B"/>
  <rect x="116" y="391" width="10" height="46" rx="5" fill="#F7B32B"/>
  <rect x="386" y="391" width="10" height="46" rx="5" fill="#F7B32B"/>
</svg>